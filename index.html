<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup Fee Payment | The WebSwan</title>
<meta name="description" content="Pay your one-time setup fee for The WebSwan or WebSwan Media Network securely with Stripe.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2447;--teal:#18afba;--blue:#1869ba;--sky:#e8f4fb;--ink:#14233a;--muted:#5c7180;--line:#d7e7ed;--bg:#f4f8fb;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eaf2f8;--muted:#a9bccb;--line:#28425e;--bg:#071a33;--card:#0d2746;--sky:#123257}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.card{width:min(480px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 24px 24px;box-shadow:0 20px 60px rgba(11,36,71,.12)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-weight:700;color:var(--blue)}
.brand span{font-size:30px;line-height:1}
h1{font:700 clamp(26px,6vw,32px)/1.15 "Playfair Display",Georgia,serif;margin:0 0 8px;color:var(--ink)}
p.lead{margin:0 0 22px;color:var(--muted)}
label{display:block;font-weight:700;margin:0 0 8px}
select{width:100%;font:500 16px/1.3 inherit;font-family:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 12px;appearance:auto;cursor:pointer}
select:focus-visible,.go:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.info{margin:16px 0 18px;padding:14px 16px;border-radius:14px;background:var(--sky);font-size:15px;min-height:72px}
.info b{display:block;font-size:17px;margin-bottom:2px}
.go{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:700 17px/1 inherit;font-family:inherit;color:#fff;background:var(--blue);cursor:pointer;text-align:center}
.go:hover{background:var(--navy)}
.go[disabled]{opacity:.45;cursor:not-allowed}
.fine{margin:14px 0 0;font-size:13px;color:var(--muted);text-align:center}
.fine a{color:var(--blue)}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><span aria-hidden="true">🦢</span> The WebSwan</div>
  <h1>Pay your setup fee</h1>
  <p class="lead">One-time payment, no subscription. Choose your service and you'll go to a secure Stripe checkout.</p>

  <label for="svc">Which service is this for?</label>
  <select id="svc">
    <option value="">Choose one…</option>
    <option value="webswan">The WebSwan</option>
    <option value="wsmn">WebSwan Media Network</option>
  </select>

  <div class="info" id="info" aria-live="polite">Pick a service above to see your setup fee.</div>

  <button class="go" id="go" type="button" disabled>Continue to secure payment</button>
  <p class="fine">🔒 Payments are processed securely by Stripe. Setup fees are non-refundable.<br>Questions? Call <a href="tel:+14158770687">(415) 877-0687</a>.</p>
</main>
<script>
/* ---- Settings: paste each Stripe Payment Link here ---- */
var LINKS = {
  webswan: { url: 'https://buy.stripe.com/eVq00l4MT7SMeVM5xK3Nm00',
             title: 'The WebSwan setup fee',
             text: 'Enter the amount shown on your invoice or quote at checkout.' },
  wsmn:    { url: 'https://buy.stripe.com/test_14A6oI2mFaX6bup2Id7AI01', /* TEST link: swap for the live link once WSMN is verified */
             title: 'WebSwan Media Network setup fee: $400.00',
             text: 'One-time setup of your WebSwan Media Network presence.' }
};
var svc = document.getElementById('svc'), info = document.getElementById('info'), go = document.getElementById('go');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function sync(){
  var l = LINKS[svc.value];
  go.disabled = !l;
  info.innerHTML = l ? '<b>' + esc(l.title) + '</b>' + esc(l.text) : 'Pick a service above to see your setup fee.';
}
svc.addEventListener('change', sync);
go.addEventListener('click', function(){ var l = LINKS[svc.value]; if (l) location.href = l.url; });
var pre = new URLSearchParams(location.search).get('for');
if (pre && LINKS[pre]) { svc.value = pre; }
sync();
</script>
</body>
</html>
